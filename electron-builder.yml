appId: com.koodex.desktop
productName: Koodex
directories:
  output: release/1.3.0
files:
  - dist/**/*
  - assets/**/*
  - package.json
win:
  icon: assets/icons/koodex.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: "Koodex-${version}-${arch}-nsis.${ext}"
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
portable:
  artifactName: "Koodex-${version}-${arch}-portable.${ext}"
