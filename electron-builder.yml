appId: com.koodex.desktop
productName: Koodex
directories:
  output: release/1.4.0
electronLanguages:
  - en-US
compression: maximum
files:
  - dist/**/*
  - '!dist/**/*.map'
  - '!node_modules/**/*'
  - assets/icons/koodex.ico
  - assets/claude-bridge.cjs
  - assets/tray/*-dual-*.png
  - assets/tray/*-logo.png
  - package.json
win:
  icon: assets/icons/koodex.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: "Koodex-${version}-${arch}-nsis.${ext}"
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
portable:
  artifactName: "Koodex-${version}-${arch}-portable.${ext}"
