appId: com.koodex.desktop
productName: Koodex
directories:
  output: release/${version}
electronLanguages:
  - en-US
compression: maximum
files:
  - dist/**/*
  - '!dist/**/*.map'
  - '!node_modules/**/*'
  - assets/icons/koodex.ico
  - assets/claude-bridge.cjs
  - assets/tray/*-dual-*.png
  - package.json
win:
  icon: assets/icons/koodex.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: "Koodex-${version}-${arch}-nsis.${ext}"
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  include: build/installer.nsh
  installerLanguages:
    - en_US
  deleteAppDataOnUninstall: false
portable:
  artifactName: "Koodex-${version}-${arch}-portable.${ext}"

publish:
  provider: github
  owner: CimanesDev
  repo: Koodex
  releaseType: release
